# 3C-SiC with phono3py's built-in SMM19 Wigner treatment (--tt smm19).
structure:
  poscar: POSCAR
  relaxation: true
calculator:
  name: nep
  model: nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  dim-fc3: [3, 3, 3]
kappa:
  engine: phono3py
  mesh: [31, 31, 31]
  temps: [100, 1000, 50]
  method: rta
  isotope: true
  wigner: true
plot:
  layout: both
  path: seekpath
  tau: nu
  temperature: 300
  kappa: all
output:
  result-dir: results
